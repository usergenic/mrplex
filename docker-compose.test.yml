services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mrplex
      POSTGRES_PASSWORD: mrplex
      POSTGRES_DB: mrplex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrplex"]
      interval: 2s
      timeout: 2s
      retries: 30
